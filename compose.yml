services:
  asakita:
    build: .
    ports: ["8787:8787"]
    volumes: ["asakita-data:/data"]
    environment:
      DATABASE_URL: "file:/data/asakita.db"
      FRONTEND_ORIGINS: "http://localhost:5173,http://localhost:5174"
      SEED_DEMO: "1"              # local containers get the demo dataset
      JWT_SECRET: "local-dev-secret-not-for-prod"
volumes:
  asakita-data:
