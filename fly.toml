# fly.toml app configuration file generated for asakita-emr on 2026-10-06T05:49:25Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'asakita-emr'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_URL = 'file:/data/asakita.db'
  PORT = '8787'
  UPLOADS_DIR = '/data/uploads'

[[mounts]]
  source = 'data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/healthz'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
